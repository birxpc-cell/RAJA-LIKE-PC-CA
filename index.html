<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOD X REAL VIP</title>
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(15, 23, 42, 0.6);
            --accent-green: #00ff87;
            --accent-glow: #60efff;
            --text-gold: #00ff87;
            --text-sub: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(0, 255, 135, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 50% 80%, rgba(96, 239, 255, 0.08) 0%, transparent 60%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 20px 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* Particles Background Effect */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(2px 2px at 20px 30px, rgba(0, 255, 135, 0.3), rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 40px 70px, rgba(255, 255, 255, 0.3), rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 80px 120px, rgba(0, 255, 135, 0.4), rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 150px 180px, rgba(255, 255, 255, 0.2), rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.6;
        }

        .container {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 18px;
            z-index: 1;
        }

        /* Live Pill */
        .live-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 255, 135, 0.05);
            border: 1px solid rgba(0, 255, 135, 0.3);
            border-radius: 50px;
            padding: 6px 16px;
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-green);
            letter-spacing: 1px;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-green);
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Profile Image */
        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin-top: 4px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-green);
            box-shadow: 0 0 25px rgba(0, 255, 135, 0.4);
        }

        /* Title & Tagline */
        .title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-shadow: 0 0 12px rgba(0, 255, 135, 0.3);
        }

        .tagline {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: -10px;
            display: flex;
            align-items: center;
            gap: 4px;
            justify-content: center;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-green), transparent);
            margin: 2px 0;
        }

        /* High-CTA Join Button */
        .cta-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00ff87 0%, #00b894 100%);
            color: #030712;
            font-size: 18px;
            font-weight: 900;
            text-decoration: none;
            letter-spacing: 1px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 25px rgba(0, 255, 135, 0.5);
            animation: pulse-animation 1.8s infinite;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .cta-btn:active {
            transform: scale(0.97);
        }

        @keyframes pulse-animation {
            0% {
                box-shadow: 0 0 15px rgba(0, 255, 135, 0.4);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 35px rgba(0, 255, 135, 0.8);
                transform: scale(1.02);
            }
            100% {
                box-shadow: 0 0 15px rgba(0, 255, 135, 0.4);
                transform: scale(1);
            }
        }

        /* Timer Card */
        .timer-card {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid rgba(0, 255, 135, 0.25);
            border-radius: 16px;
            padding: 18px 14px;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .timer-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--accent-green);
            margin-bottom: 6px;
        }

        .timer-display {
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
            margin-bottom: 6px;
            text-shadow: 0 0 10px rgba(0, 255, 135, 0.4);
        }

        .timer-desc {
            font-size: 11px;
            color: var(--text-sub);
            line-height: 1.3;
        }

        /* Stats Row */
        .stats-row {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-top: 6px;
            padding: 0 10px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-num {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent-green);
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-sub);
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        /* Footer */
        .footer {
            margin-top: 10px;
            font-size: 11px;
            color: #475569;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .footer-managed {
            color: #64748b;
        }

        .footer-managed a {
            color: var(--accent-green);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-managed a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="container">
        <!-- Live Badge -->
        <div class="live-pill">
            <span class="live-dot"></span> LIVE NOW
        </div>

        <!-- Profile Avatar -->
        <div class="avatar-container">
            <img src="https://i.ibb.co/My5FNkF8/IMG-20260903-020753-298.jpg" alt="GOD X REAL VIP" class="avatar-img">
        </div>

        <!-- Channel Title -->
        <h1 class="title">GOD X REAL VIP 👑</h1>
        <p class="tagline">Your Premium Gaming Destination 🎰</p>

        <div class="divider"></div>

        <!-- High CTA Button -->
        <a href="https://t.me/+iZJwzWjfAiczOGFl" class="cta-btn">
            JOIN NOW
        </a>

        <!-- Timer Box -->
        <div class="timer-card">
            <div class="timer-title">TIME LEFT FOR FREE JOIN</div>
            <div class="timer-display" id="countdown">00:15</div>
            <p class="timer-desc">Offer starts counting down as soon as you open the page.</p>
        </div>

        <!-- Stats Section -->
        <div class="stats-row">
            <div class="stat-item">
                <span class="stat-num">4K+</span>
                <span class="stat-label">MEMBERS</span>
            </div>
            <div class="stat-item">
                <span class="stat-num">24/7</span>
                <span class="stat-label">SUPPORT</span>
            </div>
            <div class="stat-item">
                <span class="stat-num">100%</span>
                <span class="stat-label">SECURE</span>
            </div>
        </div>

        <!-- Footer Info -->
        <div class="footer">
            <div>© 2026 All rights reserved.</div>
            <div class="footer-managed">
                Ads Managed By <a href="https://t.me/senorita_xoxo" target="_blank">@senorita_xoxo</a>
            </div>
        </div>
    </div>

    <!-- Countdown Timer Script -->
    <script>
        var timeLeft = 15;
        var countdownElement = document.getElementById('countdown');

        var timer = setInterval(function() {
            if (timeLeft <= 0) {
                countdownElement.innerText = "00:00";
            } else {
                timeLeft--;
                var seconds = timeLeft < 10 ? '0' + timeLeft : timeLeft;
                countdownElement.innerText = "00:" + seconds;
            }
        }, 1000);
    </script>

</body>
</html>
